# Hard, 25 waves. May be used in any existing world, including an Overworld arena.
# Configure with /ma admin setup nether-example. Piglins stay as piglins.
name: Nether Gauntlet
enabled: false
mode: MOB_ARENA
world: world
pos1: ''
