# Expert, 20 waves. Use a tall arena with open flight paths and safe ledges.
# Configure with /ma admin setup sky-example before enabling. No terrain is created.
# Players will need ranged kits for shulkers and phantoms; levitation remains active.
name: Sky Trials
enabled: false
mode: MOB_ARENA
world: world
pos1: ''
pos2: ''
player-spawns: []
mob-spawns: []
exit: ''
outsider-exit: ''
worldguard-region: ''
min-players: 1
max-players: 4
countdown-seconds: 15
difficulty-multiplier: 1.20
max-active-mobs: 24
max-waves: 20
waves:
  base-mobs: 3
  mobs-per-wave-per-player: 1
  max-mobs-per-wave: 48
  spawn-interval-ticks: 15
  spawn-batch-size: 1
  intermission-seconds: 12
  maximum-wave-seconds: 900
  heal-between-waves: true
  meme-rounds:
    enabled: true
    chance: 0.10
    minimum-wave: 6
    cooldown-waves: 3
    types:
      bees: {name: 'Bee Swarm', weight: 1, mobs: [BEE]}
  health-increase-percent: 10
  health-increase-every-waves: 5
  player-health-scaling:
    enabled: true
    additional-player-multiplier: 0.10
    maximum-multiplier: 1.30
  mobs:
    ENDERMITE: {unlock-wave: 1, weight: 20, health-multiplier: 1.0}
    ENDERMAN: {unlock-wave: 2, weight: 10, health-multiplier: 0.70}
    BEE: {unlock-wave: 3, weight: 8, health-multiplier: 0.9}
    BREEZE: {unlock-wave: 4, weight: 5, health-multiplier: 0.80}
    PHANTOM: {unlock-wave: 6, weight: 5, health-multiplier: 0.80}
    VEX:
      unlock-wave: 8
      weight: 4
      health-multiplier: 0.75
      equipment:
        hand: [{material: IRON_SWORD, chance: 1.0}]
        off_hand: []
        head: []
        chest: []
        legs: []
        feet: []
    SHULKER: {unlock-wave: 10, weight: 3, health-multiplier: 0.70}
