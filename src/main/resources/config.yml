# Paper 26.3 / Java 25. Economy values are starting balances, tune for your SMP.
storage:
  # SQLITE stores mobarena.db + equipment.db locally. MYSQL stores both schemas.
  # Stop the server and use the documented migration command before switching.
  type: SQLITE
  mysql:
    host: localhost
    port: 3306
    database: mobarena
    username: mobarena
    password: ''
    password-env: ''
    use-ssl: true

website-export:
  # Configure once, then restart. /ma admin reload does not replace this worker.
  enabled: false
  endpoint: 'https://www.mineplay.co.uk/api/integrations/simple-mob-arena/v1/match-snapshots'
  duel-endpoint: 'https://www.mineplay.co.uk/api/integrations/simple-mob-arena/v1/duel-snapshots'
  # Generate a new UUID for THIS ledger and register the same value on the website.
  # Once persisted, preserve it across restarts, backups and storage migrations.
  source-id: ''
  # Set a random 32..1024-character bearer credential in the Paper process environment.
  # Register the matching credential on the website. Never put it in a command or URL.
  token-env: MINEPLAY_ARENA_INGESTION_TOKEN
  connect-timeout-seconds: 5
  request-timeout-seconds: 15
  retry-base-seconds: 5
  retry-max-seconds: 3600
  poll-interval-seconds: 5
  batch-size: 10
  concurrency: 1

equipment:
  mode: BOTH # PERSONAL, CLASS, BOTH
  personal:
    preserve-durability: false
    restore-consumables: false
  # No-transfer, no-drop and no-block-edit rules are mandatory for class safety.
  # Normal personal durability and consumables are spent by default.

announcements:
  # false keeps that event's chat inside the arena. Sounds are always participant-only.
  public:
    join: true
    start: true
    end: true
  # Countdown titles are always participant-only; legacy public.countdown is ignored.
  # The initial positive countdown is always shown once, followed by these milestones.
  # [] disables subsequent countdown titles/cues. Values must be integers from 1 to 600.
  countdown-seconds: [30, 15, 10, 5, 3, 2, 1]

sounds:
  enabled: true
  # Each cue can be disabled or use a client/resource-pack sound key.
  # Volume: 0..2; pitch: 0.5..2. Existing installations use these defaults automatically.
  join: {enabled: true, sound: 'minecraft:block.note_block.pling', volume: 0.55, pitch: 1.2}
  countdown: {enabled: true, sound: 'minecraft:block.note_block.hat', volume: 0.5, pitch: 1.2}
  match-start: {enabled: true, sound: 'minecraft:block.note_block.bell', volume: 0.7, pitch: 1.0}
  wave-start: {enabled: true, sound: 'minecraft:block.note_block.chime', volume: 0.6, pitch: 1.1}
  wave-complete: {enabled: true, sound: 'minecraft:entity.experience_orb.pickup', volume: 0.7, pitch: 1.2}
  mob-kill: {enabled: true, sound: 'minecraft:entity.experience_orb.pickup', volume: 0.4, pitch: 1.7}
  eliminated: {enabled: true, sound: 'minecraft:block.note_block.bass', volume: 0.7, pitch: 0.7}
  match-end: {enabled: true, sound: 'minecraft:entity.player.levelup', volume: 0.7, pitch: 1.0}
  cancelled: {enabled: true, sound: 'minecraft:block.note_block.didgeridoo', volume: 0.5, pitch: 0.8}

waves:
  base-mobs: 5
  mobs-per-wave-per-player: 1
  health-increase-percent: 20
  health-increase-every-waves: 5
  # Mob count and health use the players who started the match, even after eliminations.
  # This health multiplier stacks with wave growth, mob variants and arena difficulty.
  # Older configs use these defaults automatically. Solo health is unchanged.
  player-health-scaling:
    enabled: true
    additional-player-multiplier: 0.15 # +15% health per player beyond the first.
    maximum-multiplier: 2.5
  max-active-mobs: 100 # Includes chicken mounts and summoned vexes. Each rider is one kill.
  max-mobs-per-wave: 500
  max-waves: 30
  spawn-interval-ticks: 10
  spawn-batch-size: 2
  intermission-seconds: 8
  maximum-wave-seconds: 600 # Missing/stuck/expired waves cancel without rewards.
  heal-between-waves: true
  # Occasionally replace a whole wave with a themed pool. Three ordinary waves
  # must pass between themes. Only types already unlocked in this arena qualify.
  # Older configs without this section keep meme rounds disabled.
  meme-rounds:
    enabled: true
    chance: 0.12
    minimum-wave: 4
    cooldown-waves: 3
    types:
      goats: {name: 'Goat Stampede', weight: 1, mobs: [GOAT]}
      llamas: {name: 'Llama Drama', weight: 1, mobs: [LLAMA]}
      bees: {name: 'Bee Swarm', weight: 1, mobs: [BEE]}
  # Slots choose one alternative from the cumulative probabilities below.
  # Remaining probability means an empty slot. All drops and XP are suppressed.
  # Undead have sunlight burning disabled through Paper's API (not helmets).
  # Arena creepers can hurt players but never destroy blocks. Endermen cannot move blocks.
  # Drowned are excluded; legacy drowned sections are ignored when loading.
  # Waves 1-2 are melee-only. Ranged-capable types have a minimum unlock of 3,
  # including legacy configurations; later configured unlock waves are retained.
  mobs:
    ZOMBIE:
      unlock-wave: 1
      weight: 24
      health-multiplier: 1.0
      baby-chance: 0.12
      chicken-jockey-chance: 0.015
      equipment:
        hand:
          - {material: STONE_SWORD, chance: 0.25}
          - {material: IRON_SHOVEL, chance: 0.10}
          - {material: IRON_SWORD, chance: 0.05}
        off_hand:
          - {material: SHIELD, chance: 0.12}
        head:
          - {material: LEATHER_HELMET, chance: 0.15}
          - {material: CHAINMAIL_HELMET, chance: 0.05}
        chest:
          - {material: LEATHER_CHESTPLATE, chance: 0.12}
    SKELETON:
      unlock-wave: 3
      weight: 18
      health-multiplier: 1.0
      # Rare bow-equipped variant; never appears before this wave.
      rapid-fire: {chance: 0.02, minimum-wave: 8, interval-ticks: 8}
      equipment:
        hand:
          - {material: BOW, chance: 0.90}
          - {material: STONE_SWORD, chance: 0.10}
        head:
          - {material: CHAINMAIL_HELMET, chance: 0.12}
        chest:
          - {material: LEATHER_CHESTPLATE, chance: 0.10}
    SPIDER:
      unlock-wave: 1
      weight: 10
      health-multiplier: 1.1
    HUSK:
      unlock-wave: 3
      weight: 9
      health-multiplier: 1.15
      baby-chance: 0.08
      equipment:
        hand:
          - {material: STONE_AXE, chance: 0.25}
        off_hand:
          - {material: SHIELD, chance: 0.10}
    STRAY:
      unlock-wave: 5
      weight: 8
      health-multiplier: 1.1
      equipment:
        hand:
          - {material: BOW, chance: 1.0}
        head:
          - {material: IRON_HELMET, chance: 0.15}
    CAVE_SPIDER:
      unlock-wave: 6
      weight: 4
      health-multiplier: 1.2
    BLAZE:
      unlock-wave: 8
      weight: 4
      health-multiplier: 1.0
    WITHER_SKELETON:
      unlock-wave: 10
      weight: 5
      health-multiplier: 1.25
      equipment:
        hand:
          - {material: STONE_SWORD, chance: 0.75}
          - {material: IRON_SWORD, chance: 0.25}
        off_hand:
          - {material: SHIELD, chance: 0.10}
    VINDICATOR:
      unlock-wave: 12
      weight: 3
      health-multiplier: 1.0
      equipment:
        hand:
          - {material: IRON_AXE, chance: 1.0}
    CREEPER:
      unlock-wave: 4
      weight: 5
      health-multiplier: 1.0
    SILVERFISH: {unlock-wave: 2, weight: 3, health-multiplier: 1.0}
    ENDERMITE: {unlock-wave: 3, weight: 2, health-multiplier: 1.0}
    GOAT: {unlock-wave: 4, weight: 3, health-multiplier: 1.0}
    LLAMA: {unlock-wave: 4, weight: 3, health-multiplier: 1.0}
    BEE: {unlock-wave: 5, weight: 3, health-multiplier: 1.0}
    PILLAGER:
      unlock-wave: 5
      weight: 6
      health-multiplier: 1.0
      equipment:
        hand:
          - {material: CROSSBOW, chance: 1.0}
    WITCH: {unlock-wave: 7, weight: 3, health-multiplier: 1.0}
    ZOMBIFIED_PIGLIN:
      unlock-wave: 7
      weight: 5
      health-multiplier: 1.0
      equipment:
        hand:
          - {material: GOLDEN_SWORD, chance: 1.0}
    PIGLIN:
      unlock-wave: 8
      weight: 4
      health-multiplier: 1.0
      equipment:
        hand:
          - {material: CROSSBOW, chance: 0.5}
          - {material: GOLDEN_SWORD, chance: 0.5}
    BREEZE: {unlock-wave: 9, weight: 2, health-multiplier: 0.9}
    ENDERMAN: {unlock-wave: 10, weight: 3, health-multiplier: 0.85}
    PHANTOM: {unlock-wave: 11, weight: 2, health-multiplier: 0.9}
    PIGLIN_BRUTE:
      unlock-wave: 12
      weight: 2
      health-multiplier: 0.8
      equipment:
        hand:
          - {material: GOLDEN_AXE, chance: 1.0}
    VEX:
      unlock-wave: 13
      weight: 2
      health-multiplier: 0.9
      equipment:
        hand:
          - {material: IRON_SWORD, chance: 1.0}
    SHULKER: {unlock-wave: 14, weight: 2, health-multiplier: 0.8}
    EVOKER: {unlock-wave: 16, weight: 1, health-multiplier: 0.9}
    IRON_GOLEM: {unlock-wave: 18, weight: 1, health-multiplier: 0.6}
    RAVAGER: {unlock-wave: 20, weight: 1, health-multiplier: 0.6}

# Optional reusable pools. An arena selects one with mob-set: undead.
# Only listed types spawn; each row inherits that type's global waves.mobs defaults.
# Arena waves.mobs replaces the whole pool when supplied. Equipment slot lists
# replace the inherited list for that slot; [] clears it.
mob-sets:
  undead:
    mobs:
      ZOMBIE: {unlock-wave: 1, weight: 30}
      HUSK: {unlock-wave: 3, weight: 12}
      SKELETON: {unlock-wave: 3, weight: 14}
      STRAY: {unlock-wave: 5, weight: 5}
      WITHER_SKELETON: {unlock-wave: 10, weight: 3}
  spiders:
    mobs:
      SPIDER: {unlock-wave: 1, weight: 10}
      CAVE_SPIDER: {unlock-wave: 6, weight: 3}

economy:
  # Brief pause before sending rewards. 0 disables the pause; maximum 30 seconds.
  # Payments stay durably queued during the pause, including across a restart.
  payment-delay-seconds: 3
  enabled: true # false suspends payments; gameplay remains available.
  provider: VAULT
  reward:
    mode: KILL_SHARE
    base-wave-reward: 100.0
    multiply-by-wave: true
    only-completed-waves: true
    minimum-reward-wave: 3
  player-scaling:
    enabled: true
    additional-player-multiplier: 0.25
    maximum-multiplier: 2.0
    snapshot-on-start: true
  limits:
    maximum-pot-per-session: 50000.0
    maximum-player-payout-per-session: 25000.0
    maximum-daily-payout-per-player: 50000.0
    reward-cooldown-minutes: 15
    minimum-participation-seconds: 60
  distribution:
    use-player-kills: true
    include-eliminated-players: true
    include-voluntary-leavers: true
    rounding-scale: 2
    zero-kills-policy: NO_PAYOUT
  short-session:
    threshold-seconds: 0 # 0 disables the reduction.
    multiplier: 1.0
  audit:
    enabled: true
    persist-settlements: true
    log-payments: true
