name: SimpleMobArena
version: '${version}'
main: cloud.mineplay.mobarena.SimpleMobArena
api-version: '26.3'
description: Fight mob waves, unlock classes, or compete in duels and team duels.
authors: [Mineplay]
website: https://github.com/Articical/SimpleMobArena
softdepend: [Vault, Essentials, WorldGuard, PlaceholderAPI, Citizens, MineplayAchievements]
commands:
  mobarena:
    description: Open the arena menu, view results or join a match.
    aliases: [ma]
    usage: /<command> [join|leave|list|info|classes|stats|history|duels|match|top|admin]
permissions:
  mobarena.admin.bypass:
    description: Enter and edit occupied arenas while not playing or recovering equipment. Other protection plugins still apply.
    default: false
  mobarena.use:
    description: Open the arena menu, class list and arena details.
    default: true
  mobarena.join:
    description: Join arenas and select equipment.
    default: true
  mobarena.stats:
    description: View personal arena statistics.
    default: true
  mobarena.stats.others:
    description: View another player's arena statistics.
    default: op
  mobarena.history:
    description: View personal match and payout history.
    default: true
  mobarena.match:
    description: View completed arena match details and participant results.
    default: true
  mobarena.top:
    description: View the arena leaderboard.
    default: true
  mobarena.admin:
    description: All MobArena administrative actions.
    default: op
    children:
      mobarena.admin.create: true
      mobarena.admin.mode: true
      mobarena.admin.mobset: true
      mobarena.admin.teamselection: true
      mobarena.admin.setteam: true
      mobarena.admin.addteam: true
      mobarena.admin.delete: true
      mobarena.admin.setplayer: true
      mobarena.admin.addplayer: true
      mobarena.admin.setmob: true
      mobarena.admin.addmob: true
      mobarena.admin.clearspawns: true
      mobarena.admin.setexit: true
      mobarena.admin.setoutsider: true
      mobarena.admin.setpos1: true
      mobarena.admin.setpos2: true
      mobarena.admin.start: true
      mobarena.admin.stop: true
      mobarena.admin.forcewave: true
      mobarena.admin.reload: true
      mobarena.admin.status: true
      mobarena.admin.setup: true
      mobarena.admin.enable: true
      mobarena.admin.economy: true
      mobarena.admin.payouts: true
      mobarena.admin.reconcile: true
      mobarena.admin.npc: true
      mobarena.admin.website: true
      mobarena.admin.achievements: true
  mobarena.admin.create:
    default: op
  mobarena.admin.mode:
    default: op
  mobarena.admin.mobset:
    default: op
  mobarena.admin.teamselection:
    default: op
  mobarena.admin.setteam:
    default: op
  mobarena.admin.addteam:
    default: op
  mobarena.admin.delete:
    default: op
  mobarena.admin.setplayer:
    default: op
  mobarena.admin.addplayer:
    default: op
  mobarena.admin.setmob:
    default: op
  mobarena.admin.addmob:
    default: op
  mobarena.admin.clearspawns:
    default: op
  mobarena.admin.setexit:
    default: op
  mobarena.admin.setoutsider:
    default: op
  mobarena.admin.setpos1:
    default: op
  mobarena.admin.setpos2:
    default: op
  mobarena.admin.start:
    default: op
  mobarena.admin.stop:
    default: op
  mobarena.admin.forcewave:
    default: op
  mobarena.admin.reload:
    default: op
  mobarena.admin.status:
    default: op
  mobarena.admin.setup:
    default: op
  mobarena.admin.enable:
    default: op
  mobarena.admin.economy:
    default: op
  mobarena.admin.payouts:
    default: op
  mobarena.admin.reconcile:
    default: op
  mobarena.admin.npc:
    description: Create and link Citizens NPCs to the arena selection menu.
    default: op
  mobarena.admin.website:
    description: Inspect website export, backfill matches and retry retained HTTP events.
    default: op
  mobarena.admin.achievements:
    description: Inspect achievement integration and replay a player's saved arena progress.
    default: op
