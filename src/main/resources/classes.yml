# All kit content is configuration, not game-engine code. Slots are 0-35.
# Enchantment/effect identifiers use Minecraft registry names.
# Potion amplifiers are zero based; duration -1 lasts for the arena visit.
classes:
  knight:
    display-name: Knight
    items:
      '0':
        material: IRON_SWORD
        enchantments:
          sharpness: 1
      '1':
        material: COOKED_BEEF
        amount: 16
    armor:
      helmet: { material: IRON_HELMET }
      chestplate: { material: IRON_CHESTPLATE }
      leggings: { material: IRON_LEGGINGS }
      boots: { material: IRON_BOOTS }
    offhand: { material: SHIELD }
  archer:
    display-name: Archer
    items:
      '0':
        material: BOW
        enchantments:
          power: 2
      '1': { material: STONE_SWORD }
      '2': { material: ARROW, amount: 64 }
      '3': { material: ARROW, amount: 64 }
      '4': { material: COOKED_BEEF, amount: 16 }
    armor:
      helmet: { material: LEATHER_HELMET }
      chestplate: { material: CHAINMAIL_CHESTPLATE }
      leggings: { material: LEATHER_LEGGINGS }
      boots: { material: CHAINMAIL_BOOTS }
  tank:
    display-name: Tank
    items:
      '0': { material: STONE_SWORD }
      '1': { material: COOKED_BEEF, amount: 16 }
    armor:
      helmet: { material: IRON_HELMET }
      chestplate:
        material: DIAMOND_CHESTPLATE
        enchantments:
          protection: 2
      leggings: { material: IRON_LEGGINGS }
      boots: { material: IRON_BOOTS }
    offhand: { material: SHIELD }
    effects:
      slowness: { amplifier: 0, duration-ticks: -1 }
  berserker:
    display-name: Berserker
    items:
      '0':
        material: DIAMOND_AXE
        enchantments:
          sharpness: 2
      '1': { material: COOKED_BEEF, amount: 16 }
    armor:
      helmet: { material: LEATHER_HELMET }
      chestplate: { material: CHAINMAIL_CHESTPLATE }
      leggings: { material: LEATHER_LEGGINGS }
      boots: { material: LEATHER_BOOTS }
