# Spawn Arena - 1 to 4 players, 30 waves, all 28 supported mob types.
# Requires SimpleMobArena 1.0.10 or later. Your positions are unchanged.
# Copy to plugins/SimpleMobArena/arenas/spawn.yml, then /ma admin reload.
# Check /ma admin setup spawn after reloading; terrain and WorldGuard still apply.
