  - world,261.20541715349594,102.0,-475.46828884644793,89.24496,-2.8503184
  - world,260.53593826566305,103.0,-463.9005333060856,126.145035,2.5496652
exit: world,247.89262434499298,102.0,-446.2987178840691,179.54492,-0.3003199
outsider-exit: world,247.91129765399677,113.0,-453.90064017849227,179.54509,9.749675
min-players: 1
max-players: 4
countdown-seconds: 15
difficulty-multiplier: 1.0
# Smaller concurrent crowd for this roughly 34 x 35 block arena; later mobs queue.
max-active-mobs: 40
max-waves: 30
worldguard-region: ''

# This local pool is complete; it does not need a named mob set in config.yml.
# Kill requirements, prize funding, payment caps and class kits remain in config.yml/classes.yml.
waves:
  # Count = 5 + wave x starting players, then capped. Difficulty scales health.
  # Solo: 6 on wave 1, 15 on wave 10, 35 on wave 30.
  # Four players: 9 on wave 1, 45 on wave 10, capped at 100 from wave 24.
  base-mobs: 5
  mobs-per-wave-per-player: 1
  max-mobs-per-wave: 100
  spawn-interval-ticks: 10
  spawn-batch-size: 2
  intermission-seconds: 10
  maximum-wave-seconds: 900
  heal-between-waves: true
  # 12% chance on eligible waves; the selected theme lasts for the whole wave.
  # Three ordinary waves must pass before another. Missing/locked types cannot appear.
  meme-rounds:
    enabled: true
    chance: 0.12
    minimum-wave: 4
    cooldown-waves: 3
    types:
      goats: {name: 'Goat Stampede', weight: 1, mobs: [GOAT]}
      llamas: {name: 'Llama Drama', weight: 1, mobs: [LLAMA]}
      bees: {name: 'Bee Swarm', weight: 1, mobs: [BEE]}
  # +10% base health at waves 6, 11, 16, 21 and 26 (additive).
  health-increase-percent: 10
  health-increase-every-waves: 5
  player-health-scaling:
    enabled: true
    additional-player-multiplier: 0.10
    maximum-multiplier: 1.30
  # Both count and health use the original player count for the whole match.
  # Each spawn rolls among unlocked mobs: weight is relative, not a percentage.
  # Later waves retain earlier mobs. Rare heavy enemies are not guaranteed bosses.
  # Ranged mobs start on wave 3 at the earliest. Creepers cannot break blocks;
  # endermen cannot pick up or place blocks. Drowned remain excluded.
  # Give ravagers/golems broad clear spawn pads and endermen three blocks of height.
  # The existing Y=100..109 boundary is kept; check flying mobs have room to move.
  mobs:
    ZOMBIE:
      unlock-wave: 1
      weight: 40
      health-multiplier: 1.0
      baby-chance: 0.10
      chicken-jockey-chance: 0.015
      equipment:
        hand:
          - {material: STONE_SWORD, chance: 0.25}
          - {material: IRON_SHOVEL, chance: 0.10}
          - {material: IRON_SWORD, chance: 0.05}
        off_hand:
          - {material: SHIELD, chance: 0.12}
        head:
          - {material: LEATHER_HELMET, chance: 0.15}
          - {material: CHAINMAIL_HELMET, chance: 0.05}
        chest:
          - {material: LEATHER_CHESTPLATE, chance: 0.12}
        legs: []
        feet: []
    SPIDER: {unlock-wave: 1, weight: 18, health-multiplier: 1.0}
